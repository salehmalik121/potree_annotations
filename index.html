<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Potree LAZ Viewer</title>

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">

	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			font-family: "Inter", "Segoe UI", Roboto, sans-serif;
		}

		#potree_container {
			width: 100%;
			height: 100%;
		}

		#app_hud {
			position: fixed;
			top: 16px;
			left: 16px;
			z-index: 1000;
			display: flex;
			flex-direction: column;
			gap: 10px;
			color: #f7fbff;
			pointer-events: none;
		}

		.hud-card {
			background: rgba(5, 16, 30, 0.74);
			backdrop-filter: blur(8px);
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 12px;
			padding: 10px 14px;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
			max-width: 340px;
		}

		#hud_title {
			font-size: 14px;
			font-weight: 700;
			letter-spacing: 0.02em;
		}

		#hud_subtitle {
			font-size: 12px;
			opacity: 0.8;
			margin-top: 4px;
		}

		.hud-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			font-size: 12px;
		}

		#annotation_count {
			background: linear-gradient(135deg, #2ad3ff, #5d88ff);
			padding: 4px 10px;
			border-radius: 999px;
			font-weight: 700;
			font-size: 12px;
		}

		#input-div {
			display: flex;
			gap: 8px;
			padding: 8px;
			background: rgba(7, 14, 24, 0.86);
			border: 1px solid rgba(255, 255, 255, 0.25);
			border-radius: 10px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
		}

		#ant-input {
			background: rgba(255, 255, 255, 0.92);
			border: 1px solid #d5ddf0;
			border-radius: 8px;
			padding: 6px 10px;
			min-width: 220px;
		}

		#save-btn,
		#cancel-btn {
			border: none;
			border-radius: 8px;
			padding: 6px 10px;
			font-weight: 600;
			cursor: pointer;
		}

		#save-btn {
			background: #2ed48d;
			color: #052716;
		}

		#cancel-btn {
			background: #f4f6fa;
			color: #1f2d4a;
		}


		#annotations_panel {
			position: fixed;
			right: 16px;
			top: 16px;
			bottom: 16px;
			width: 320px;
			z-index: 1000;
			background: rgba(6, 18, 32, 0.82);
			backdrop-filter: blur(8px);
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 12px;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
			display: flex;
			flex-direction: column;
			color: #f7fbff;
			overflow: hidden;
		}

		#annotations_panel_header {
			padding: 12px 14px;
			font-size: 13px;
			font-weight: 700;
			border-bottom: 1px solid rgba(255, 255, 255, 0.15);
		}

		#annotations_list {
			list-style: none;
			margin: 0;
			padding: 10px;
			overflow-y: auto;
			flex: 1;
		}

		#annotations_empty {
			padding: 12px 14px;
			font-size: 12px;
			opacity: 0.8;
		}

		.annotation-item {
			padding: 10px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.05);
			margin-bottom: 8px;
		}

		.annotation-item-title {
			font-size: 12px;
			font-weight: 600;
			margin-bottom: 4px;
		}

		.annotation-item-meta {
			font-size: 11px;
			opacity: 0.8;
		}


		#annotations_panel_toolbar {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 8px;
			padding: 10px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.15);
		}

		.annotation-control {
			background: rgba(255, 255, 255, 0.9);
			border: 1px solid #ccd4e6;
			border-radius: 6px;
			padding: 6px 8px;
			font-size: 12px;
		}

		#export_annotations_btn {
			grid-column: span 2;
			background: linear-gradient(135deg, #48e2b7, #3f91ff);
			color: #052036;
			font-weight: 700;
			border: none;
			cursor: pointer;
		}

		#annotations_panel_info {
			padding: 8px 12px;
			font-size: 11px;
			opacity: 0.8;
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
		}

		.annotation-item-actions {
			display: flex;
			gap: 6px;
			margin-top: 8px;
		}

		.annotation-mini-btn {
			border: 1px solid rgba(255, 255, 255, 0.35);
			background: rgba(255, 255, 255, 0.08);
			color: #e7f4ff;
			font-size: 11px;
			padding: 4px 8px;
			border-radius: 999px;
			cursor: pointer;
		}

		@media (max-width: 1080px) {
			#annotations_panel {
				width: 260px;
				right: 10px;
				top: 10px;
				bottom: 10px;
			}

			#app_hud {
				left: 10px;
				top: 10px;
			}

			#ant-input {
				min-width: 160px;
			}

			#annotations_panel_toolbar {
				grid-template-columns: 1fr;
			}

			#export_annotations_btn {
				grid-column: span 1;
			}
		}
	</style>
</head>

<body>
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('../build/potree/resources/images/background.jpg');">
		</div>
		<div id="potree_sidebar_container"> </div>
	</div>

	<div id="app_hud">
		<div class="hud-card">
			<div id="hud_title">Potree Annotation Studio</div>
			<div id="hud_subtitle">Click anywhere on the cloud to create notes and collaborate faster.</div>
		</div>
		<div class="hud-card hud-row">
			<span>Total annotations</span>
			<span id="annotation_count">0</span>
		</div>
	</div>

	<div id="annotations_panel">
		<div id="annotations_panel_header">Annotations</div>
		<div id="annotations_panel_toolbar">
			<input id="annotations_search" class="annotation-control" type="text" placeholder="Search title or id" />
			<select id="annotations_sort" class="annotation-control">
				<option value="newest">Newest first</option>
				<option value="oldest">Oldest first</option>
				<option value="title">Title A-Z</option>
			</select>
			<button id="export_annotations_btn" class="annotation-control">Export annotations JSON</button>
		</div>
		<div id="annotations_panel_info">
			<span id="visible_annotations_count">0 shown</span>
		</div>
		<div id="annotations_empty">No annotations yet.</div>
		<ul id="annotations_list"></ul>
	</div>


	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

	<script type="module" src="./main.js" ></script>
</body>

</html>
